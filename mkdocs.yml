site_name: wildintel-tools
site_description: Utilities for validating and preparing wildlife monitoring data for the WildINTEL project and Trapper platform
site_url: https://ijfvianauhu.github.io/wildintel-tools
copyright: Copyright &copy; 2026 <a href="https://wildintel.eu/">WildINTEL</a>

repo_url: https://github.com/ijfvianauhu/wildintel-tools
repo_name: ijfvianauhu/wildintel-tools

theme:
  name: material
  language: en
  logo: imgs/logo.png
  favicon: imgs/logo.png

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wildintelproject
      name: WildINTEL on GitHub
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/people/WildIntel/61556603674655/
      name: WildINTEL on Facebook
    - icon: simple/bluesky
      link: https://bsky.app/profile/wildintel.bsky.social
      name: WildINTEL on Bluesky
    - icon: fontawesome/solid/globe
      link: https://wildintel.eu/
      name: WildINTEL website

extra_css:
  - stylesheets/extras.css

plugins:
  - search

markdown_extensions:
  - toc:
      title: On this page
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Commands:
    - config: commands/config.md
    - reports: commands/reports.md
    - logger: commands/logger.md
    - helpers: commands/helpers.md
    - wildintel: commands/wildintel.md
    - epicollect: commands/epicollect.md
    - zooniverse: commands/zooniverse.md
