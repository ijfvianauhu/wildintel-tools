site_name: wildintel-tools
site_description: Utilities for validating and preparing wildlife monitoring data for the WildINTEL project and Trapper platform
site_url: https://ijfvianauhu.github.io/wildintel-tools
repo_url: https://github.com/ijfvianauhu/wildintel-tools
repo_name: wildintel-tools

theme:
  name: material
  language: en
  logo: imgs/logo.png
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extras.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Commands:
    - config: commands/config.md
    - reports: commands/reports.md
    - logger: commands/logger.md
    - helpers: commands/helpers.md
    - wildintel: commands/wildintel.md
    - epicollect: commands/epicollect.md
    - zooniverse: commands/zooniverse.md
